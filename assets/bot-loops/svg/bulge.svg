<svg xmlns="http://www.w3.org/2000/svg" class="bot-avatar" data-mood="bulge" viewBox="-200 -150 1500 1500" width="480" height="480" role="img" aria-label="Eyeballs out loop"><defs><radialGradient id="g" cx="0.45" cy="0.14" r="1"><stop offset="0" stop-color="#52cd63"/><stop offset="0.5" stop-color="#2eae43"/><stop offset="1" stop-color="#12862a"/></radialGradient></defs><style><![CDATA[.bot-avatar{--bot-ink: #06110a;--bot-shadow: #1b3a23;--bot-muted: #526457;--bot-accent: #1c8f37}.b-body{stroke:rgba(4,44,16,.55);stroke-width:3}.b-ghost{opacity:0}.b-ghost-a{fill:#19f0ff}.b-ghost-b{fill:#ff2fa8}.b-rage{fill:#e8362f;opacity:0}.b-eye{fill:var(--bot-ink);transform-box:fill-box;transform-origin:center}.b-heart{fill:#ff3d6e;opacity:0;transform-box:fill-box;transform-origin:center}.b-hf{fill:#ff5c86;opacity:0;transform-box:fill-box;transform-origin:center}.b-tongue{fill:#ff7096;stroke:var(--bot-ink);stroke-width:10;stroke-linejoin:round;opacity:0;transform-box:fill-box;transform-origin:50% 0}.b-m{transform-box:fill-box;transform-origin:center}.b-m-smile,.b-m-flat{fill:none;stroke:var(--bot-ink);stroke-width:38;stroke-linecap:round}.b-m-open{fill:var(--bot-ink)}.b-m-open,.b-m-flat{opacity:0}.b-rig,.b-ghost,.b-rage{transform-box:fill-box;transform-origin:50% 100%}.b-ghost{transform-origin:center}.b-shadow{fill:var(--bot-shadow);opacity:.14;transform-box:fill-box;transform-origin:center}.b-star{fill:#ffd23f;stroke:#c98f00;stroke-width:4;stroke-linejoin:round;opacity:0}.b-puff{fill:var(--bot-muted);opacity:0;transform-box:fill-box;transform-origin:center}.b-drop{fill:#7fd3ff;opacity:0;transform-box:fill-box;transform-origin:center}.b-achoo{fill:var(--bot-accent);font-family:system-ui,sans-serif;font-weight:700;opacity:0;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion: reduce){.bot-avatar *{animation:none !important}}.bot-avatar[data-mood=bulge] .b-rig{animation:bulgeBot 1.4s ease-in-out infinite}.bot-avatar[data-mood=bulge] .b-face{animation:bulgeFace 1.4s linear infinite}.bot-avatar[data-mood=bulge] .b-eye{animation:bulgeEye 1.4s ease-in-out infinite}.bot-avatar[data-mood=bulge] .b-m-smile{animation:bulgeSmile 1.4s ease-in-out infinite}.bot-avatar[data-mood=bulge] .b-m-open{animation:bulgeOpen 1.4s ease-in-out infinite}@keyframes bulgeBot{0%,100%{transform:translateY(0) scale(1, 1)}8%{transform:translateY(-50px) scale(0.95, 1.1)}14%{transform:translateY(0) scale(1.05, 0.95)}22%,80%{transform:translateY(0) scale(1, 1)}}@keyframes bulgeFace{0%,14%{transform:translate(0, 0)}16%{transform:translate(6px, -3px)}19%{transform:translate(-6px, 3px)}22%{transform:translate(5px, 2px)}25%{transform:translate(-5px, -3px)}28%{transform:translate(6px, -2px)}31%{transform:translate(-6px, 3px)}34%{transform:translate(5px, -3px)}37%{transform:translate(-5px, 2px)}40%{transform:translate(6px, 3px)}43%{transform:translate(-6px, -2px)}46%{transform:translate(5px, 2px)}49%{transform:translate(-5px, -3px)}52%{transform:translate(6px, -3px)}55%{transform:translate(-6px, 2px)}58%{transform:translate(5px, 3px)}61%{transform:translate(-5px, -2px)}64%{transform:translate(6px, 2px)}67%{transform:translate(-6px, -3px)}70%,100%{transform:translate(0, 0)}}@keyframes bulgeEye{0%,100%{transform:scale(1, 1)}8%{transform:scale(1.95, 2.05)}14%{transform:scale(1.65, 1.7)}20%,70%{transform:scale(1.7, 1.75)}80%{transform:scale(0.85, 0.85)}88%{transform:scale(1.08, 1.08)}94%{transform:scale(1, 1)}}@keyframes bulgeSmile{0%,6%,82%,100%{opacity:1}9%,78%{opacity:0}}@keyframes bulgeOpen{0%,6%{opacity:0;transform:scale(0.3)}9%{opacity:1;transform:scale(1.9, 2.3)}14%{transform:scale(1.7, 2)}20%,70%{opacity:1;transform:scale(1.8, 1.8)}78%{opacity:1;transform:scale(0.5)}82%,100%{opacity:0;transform:scale(0.3)}}]]></style><ellipse class="b-shadow" cx="553" cy="1112" rx="330" ry="34"/><g class="b-rig"><path class="b-body" d="M555 28 C800 28 1045 300 1045 620 C1045 880 850 1075 555 1075 C260 1075 62 880 62 620 C62 300 310 28 555 28 Z" fill="url(#g)"/><g class="b-face"><g class="b-eyes"><ellipse class="b-eye b-eye-l" cx="362" cy="520" rx="60" ry="101"/><ellipse class="b-eye b-eye-r" cx="755" cy="520" rx="60" ry="101"/></g><path class="b-m b-m-smile" d="M448 690 Q560 752 672 690"/><ellipse class="b-m b-m-open" cx="558" cy="712" rx="46" ry="60"/><path class="b-m b-m-flat" d="M474 712 L646 712"/></g></g></svg>
