<svg xmlns="http://www.w3.org/2000/svg" class="bot-avatar" data-mood="heart" viewBox="-200 -150 1500 1500" width="480" height="480" role="img" aria-label="Heart eyes loop"><defs><radialGradient id="g" cx="0.45" cy="0.14" r="1"><stop offset="0" stop-color="#52cd63"/><stop offset="0.5" stop-color="#2eae43"/><stop offset="1" stop-color="#12862a"/></radialGradient></defs><style><![CDATA[.bot-avatar{--bot-ink: #06110a;--bot-shadow: #1b3a23;--bot-muted: #526457;--bot-accent: #1c8f37}.b-body{stroke:rgba(4,44,16,.55);stroke-width:3}.b-ghost{opacity:0}.b-ghost-a{fill:#19f0ff}.b-ghost-b{fill:#ff2fa8}.b-rage{fill:#e8362f;opacity:0}.b-eye{fill:var(--bot-ink);transform-box:fill-box;transform-origin:center}.b-heart{fill:#ff3d6e;opacity:0;transform-box:fill-box;transform-origin:center}.b-hf{fill:#ff5c86;opacity:0;transform-box:fill-box;transform-origin:center}.b-tongue{fill:#ff7096;stroke:var(--bot-ink);stroke-width:10;stroke-linejoin:round;opacity:0;transform-box:fill-box;transform-origin:50% 0}.b-m{transform-box:fill-box;transform-origin:center}.b-m-smile,.b-m-flat{fill:none;stroke:var(--bot-ink);stroke-width:38;stroke-linecap:round}.b-m-open{fill:var(--bot-ink)}.b-m-open,.b-m-flat{opacity:0}.b-rig,.b-ghost,.b-rage{transform-box:fill-box;transform-origin:50% 100%}.b-ghost{transform-origin:center}.b-shadow{fill:var(--bot-shadow);opacity:.14;transform-box:fill-box;transform-origin:center}.b-star{fill:#ffd23f;stroke:#c98f00;stroke-width:4;stroke-linejoin:round;opacity:0}.b-puff{fill:var(--bot-muted);opacity:0;transform-box:fill-box;transform-origin:center}.b-drop{fill:#7fd3ff;opacity:0;transform-box:fill-box;transform-origin:center}.b-achoo{fill:var(--bot-accent);font-family:system-ui,sans-serif;font-weight:700;opacity:0;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion: reduce){.bot-avatar *{animation:none !important}}.bot-avatar[data-mood=heart] .b-rig{animation:heartBot 1.6s ease-in-out infinite}.bot-avatar[data-mood=heart] .b-eye{opacity:0}.bot-avatar[data-mood=heart] .b-heart{opacity:1;animation:beat 1.6s ease-in-out infinite}.bot-avatar[data-mood=heart] .b-m-smile{animation:heartMouth 1.6s ease-in-out infinite}.bot-avatar[data-mood=heart] .b-hf{animation:floatHeart 1.6s ease-out infinite}.bot-avatar[data-mood=heart] .b-hf2{animation-delay:-0.55s}.bot-avatar[data-mood=heart] .b-hf3{animation-delay:-1.1s}@keyframes heartBot{0%,100%{transform:rotate(-2deg) scale(1, 1)}8%{transform:rotate(-1.4deg) scale(1.035, 1.035)}18%{transform:rotate(-0.2deg) scale(1, 1)}28%{transform:rotate(0.8deg) scale(1.035, 1.035)}42%{transform:rotate(1.6deg) scale(1, 1)}50%{transform:rotate(2deg) scale(1, 1)}75%{transform:rotate(0.4deg) scale(1, 1)}}@keyframes beat{0%,42%,100%{transform:scale(1)}8%,28%{transform:scale(1.3)}18%{transform:scale(1.02)}}@keyframes heartMouth{0%,18%,42%,100%{transform:scale(1.15, 1.2)}8%,28%{transform:scale(1.3, 1.5)}}@keyframes floatHeart{0%{opacity:0;transform:translate(0, 0) scale(0.6)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx), -480px) scale(1.15)}}]]></style><ellipse class="b-shadow" cx="553" cy="1112" rx="330" ry="34"/><g class="b-rig"><path class="b-body" d="M555 28 C800 28 1045 300 1045 620 C1045 880 850 1075 555 1075 C260 1075 62 880 62 620 C62 300 310 28 555 28 Z" fill="url(#g)"/><g class="b-face"><g class="b-eyes"><ellipse class="b-eye b-eye-l" cx="362" cy="520" rx="60" ry="101"/><ellipse class="b-eye b-eye-r" cx="755" cy="520" rx="60" ry="101"/><g transform="translate(362 520)"><path class="b-heart" d="M0 62 C-100 -5 -62 -92 0 -40 C62 -92 100 -5 0 62 Z"/></g><g transform="translate(755 520)"><path class="b-heart" d="M0 62 C-100 -5 -62 -92 0 -40 C62 -92 100 -5 0 62 Z"/></g></g><path class="b-m b-m-smile" d="M448 690 Q560 752 672 690"/><ellipse class="b-m b-m-open" cx="558" cy="712" rx="46" ry="60"/><path class="b-m b-m-flat" d="M474 712 L646 712"/></g></g><g transform="translate(200 140) scale(.38)"><path class="b-hf b-hf1" style="--dx:-60px" d="M0 62 C-100 -5 -62 -92 0 -40 C62 -92 100 -5 0 62 Z"/></g><g transform="translate(900 110) scale(.38)"><path class="b-hf b-hf2" style="--dx:50px" d="M0 62 C-100 -5 -62 -92 0 -40 C62 -92 100 -5 0 62 Z"/></g><g transform="translate(553 0) scale(.38)"><path class="b-hf b-hf3" style="--dx:0px" d="M0 62 C-100 -5 -62 -92 0 -40 C62 -92 100 -5 0 62 Z"/></g></svg>
