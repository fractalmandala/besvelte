<svg xmlns="http://www.w3.org/2000/svg" class="bot-avatar" data-mood="sneeze" viewBox="-200 -150 1500 1500" width="480" height="480" role="img" aria-label="Achoo loop"><defs><radialGradient id="g" cx="0.45" cy="0.14" r="1"><stop offset="0" stop-color="#52cd63"/><stop offset="0.5" stop-color="#2eae43"/><stop offset="1" stop-color="#12862a"/></radialGradient></defs><style><![CDATA[.bot-avatar{--bot-ink: #06110a;--bot-shadow: #1b3a23;--bot-muted: #526457;--bot-accent: #1c8f37}.b-body{stroke:rgba(4,44,16,.55);stroke-width:3}.b-ghost{opacity:0}.b-ghost-a{fill:#19f0ff}.b-ghost-b{fill:#ff2fa8}.b-rage{fill:#e8362f;opacity:0}.b-eye{fill:var(--bot-ink);transform-box:fill-box;transform-origin:center}.b-heart{fill:#ff3d6e;opacity:0;transform-box:fill-box;transform-origin:center}.b-hf{fill:#ff5c86;opacity:0;transform-box:fill-box;transform-origin:center}.b-tongue{fill:#ff7096;stroke:var(--bot-ink);stroke-width:10;stroke-linejoin:round;opacity:0;transform-box:fill-box;transform-origin:50% 0}.b-m{transform-box:fill-box;transform-origin:center}.b-m-smile,.b-m-flat{fill:none;stroke:var(--bot-ink);stroke-width:38;stroke-linecap:round}.b-m-open{fill:var(--bot-ink)}.b-m-open,.b-m-flat{opacity:0}.b-rig,.b-ghost,.b-rage{transform-box:fill-box;transform-origin:50% 100%}.b-ghost{transform-origin:center}.b-shadow{fill:var(--bot-shadow);opacity:.14;transform-box:fill-box;transform-origin:center}.b-star{fill:#ffd23f;stroke:#c98f00;stroke-width:4;stroke-linejoin:round;opacity:0}.b-puff{fill:var(--bot-muted);opacity:0;transform-box:fill-box;transform-origin:center}.b-drop{fill:#7fd3ff;opacity:0;transform-box:fill-box;transform-origin:center}.b-achoo{fill:var(--bot-accent);font-family:system-ui,sans-serif;font-weight:700;opacity:0;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion: reduce){.bot-avatar *{animation:none !important}}.bot-avatar[data-mood=sneeze] .b-rig{animation:sneezeBot 2s ease-in-out infinite}.bot-avatar[data-mood=sneeze] .b-face{animation:sneezeFace 2s ease-in-out infinite}.bot-avatar[data-mood=sneeze] .b-eye{animation:sneezeEye 2s ease-in-out infinite}.bot-avatar[data-mood=sneeze] .b-m-smile{animation:sneezeSmile 2s ease-in-out infinite}.bot-avatar[data-mood=sneeze] .b-m-open{animation:sneezeOpen 2s ease-in-out infinite}.bot-avatar[data-mood=sneeze] .b-drop{animation:dropFly 2s ease-out infinite}.bot-avatar[data-mood=sneeze] .b-achoo{animation:achooPop 2s ease-out infinite}@keyframes sneezeBot{0%,72%,100%{transform:translateY(0) scale(1, 1) rotate(0deg)}30%{transform:translateY(0) scale(1.1, 1.1) rotate(-4deg)}40%{transform:translateY(0) scale(1.12, 1.12) rotate(-5deg)}44%{transform:translateY(10px) scale(0.84, 0.8) rotate(4deg)}52%{transform:translateY(0) scale(1.05, 1.04) rotate(-1deg)}62%{transform:translateY(0) scale(0.99, 0.99) rotate(0deg)}}@keyframes sneezeFace{0%,66%,100%{transform:translate(0, 0)}30%,40%{transform:translate(0, -26px)}44%{transform:translate(0, 26px)}56%{transform:translate(0, 10px)}}@keyframes sneezeEye{0%,24%,68%,100%{transform:scaleY(1)}32%{transform:scaleY(1.1)}38%{transform:scaleY(0.75)}43%,58%{transform:scaleY(0.05)}}@keyframes sneezeSmile{0%,24%,66%,100%{opacity:1}28%,60%{opacity:0}}@keyframes sneezeOpen{0%,24%,66%,100%{opacity:0;transform:scale(0.4)}28%{opacity:1;transform:scale(0.55, 0.8)}40%{opacity:1;transform:scale(0.75, 1)}44%{opacity:1;transform:scale(1.7, 1.4)}58%{opacity:1;transform:scale(1.5, 1.3)}62%{opacity:1;transform:scale(0.4)}}@keyframes dropFly{0%,43%{opacity:0;transform:translate(0, 0) scale(0.4)}46%{opacity:1}62%{opacity:1;transform:translate(var(--dx), var(--dy)) scale(1)}70%,100%{opacity:0;transform:translate(var(--dx), calc(var(--dy) + 120px)) scale(0.8)}}@keyframes achooPop{0%,43%{opacity:0;transform:scale(0.3) rotate(8deg)}47%{opacity:1;transform:scale(1.2) rotate(8deg)}52%,62%{opacity:1;transform:scale(1) rotate(8deg)}70%,100%{opacity:0;transform:scale(1.1) rotate(8deg)}}]]></style><ellipse class="b-shadow" cx="553" cy="1112" rx="330" ry="34"/><g class="b-rig"><path class="b-body" d="M555 28 C800 28 1045 300 1045 620 C1045 880 850 1075 555 1075 C260 1075 62 880 62 620 C62 300 310 28 555 28 Z" fill="url(#g)"/><g class="b-face"><g class="b-eyes"><ellipse class="b-eye b-eye-l" cx="362" cy="520" rx="60" ry="101"/><ellipse class="b-eye b-eye-r" cx="755" cy="520" rx="60" ry="101"/></g><path class="b-m b-m-smile" d="M448 690 Q560 752 672 690"/><ellipse class="b-m b-m-open" cx="558" cy="712" rx="46" ry="60"/><path class="b-m b-m-flat" d="M474 712 L646 712"/></g></g><circle class="b-drop" style="--dx:-360px;--dy:90px" cx="558" cy="745" r="15"/><circle class="b-drop" style="--dx:-300px;--dy:-60px" cx="558" cy="745" r="15"/><circle class="b-drop" style="--dx:-190px;--dy:-170px" cx="558" cy="745" r="15"/><circle class="b-drop" style="--dx:360px;--dy:90px" cx="558" cy="745" r="15"/><circle class="b-drop" style="--dx:300px;--dy:-60px" cx="558" cy="745" r="15"/><circle class="b-drop" style="--dx:190px;--dy:-170px" cx="558" cy="745" r="15"/><text class="b-achoo" x="1060" y="100" font-size="110" text-anchor="middle">ACHOO!</text></svg>
