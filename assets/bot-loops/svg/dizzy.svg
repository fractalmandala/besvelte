<svg xmlns="http://www.w3.org/2000/svg" class="bot-avatar" data-mood="dizzy" viewBox="-200 -150 1500 1500" width="480" height="480" role="img" aria-label="Dizzy loop"><defs><radialGradient id="g" cx="0.45" cy="0.14" r="1"><stop offset="0" stop-color="#52cd63"/><stop offset="0.5" stop-color="#2eae43"/><stop offset="1" stop-color="#12862a"/></radialGradient></defs><style><![CDATA[.bot-avatar{--bot-ink: #06110a;--bot-shadow: #1b3a23;--bot-muted: #526457;--bot-accent: #1c8f37}.b-body{stroke:rgba(4,44,16,.55);stroke-width:3}.b-ghost{opacity:0}.b-ghost-a{fill:#19f0ff}.b-ghost-b{fill:#ff2fa8}.b-rage{fill:#e8362f;opacity:0}.b-eye{fill:var(--bot-ink);transform-box:fill-box;transform-origin:center}.b-heart{fill:#ff3d6e;opacity:0;transform-box:fill-box;transform-origin:center}.b-hf{fill:#ff5c86;opacity:0;transform-box:fill-box;transform-origin:center}.b-tongue{fill:#ff7096;stroke:var(--bot-ink);stroke-width:10;stroke-linejoin:round;opacity:0;transform-box:fill-box;transform-origin:50% 0}.b-m{transform-box:fill-box;transform-origin:center}.b-m-smile,.b-m-flat{fill:none;stroke:var(--bot-ink);stroke-width:38;stroke-linecap:round}.b-m-open{fill:var(--bot-ink)}.b-m-open,.b-m-flat{opacity:0}.b-rig,.b-ghost,.b-rage{transform-box:fill-box;transform-origin:50% 100%}.b-ghost{transform-origin:center}.b-shadow{fill:var(--bot-shadow);opacity:.14;transform-box:fill-box;transform-origin:center}.b-star{fill:#ffd23f;stroke:#c98f00;stroke-width:4;stroke-linejoin:round;opacity:0}.b-puff{fill:var(--bot-muted);opacity:0;transform-box:fill-box;transform-origin:center}.b-drop{fill:#7fd3ff;opacity:0;transform-box:fill-box;transform-origin:center}.b-achoo{fill:var(--bot-accent);font-family:system-ui,sans-serif;font-weight:700;opacity:0;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion: reduce){.bot-avatar *{animation:none !important}}.bot-avatar[data-mood=dizzy] .b-rig{animation:dizzyBot 2s ease-in-out infinite}.bot-avatar[data-mood=dizzy] .b-eye-l{animation:dizzyEye 1s linear infinite}.bot-avatar[data-mood=dizzy] .b-eye-r{animation:dizzyEye 1s linear infinite reverse}.bot-avatar[data-mood=dizzy] .b-m-smile{opacity:0}.bot-avatar[data-mood=dizzy] .b-m-flat{opacity:1;animation:dizzyMouth 1s ease-in-out infinite}.bot-avatar[data-mood=dizzy] .b-star{opacity:1;animation:orbit 1s linear infinite}.bot-avatar[data-mood=dizzy] .b-s2{animation-delay:-0.25s}.bot-avatar[data-mood=dizzy] .b-s3{animation-delay:-0.5s}.bot-avatar[data-mood=dizzy] .b-s4{animation-delay:-0.75s}@keyframes dizzyBot{0%,50%,100%{transform:translate(0, 0) rotate(0deg)}25%{transform:translate(-24px, 0) rotate(-6deg)}75%{transform:translate(24px, 0) rotate(6deg)}}@keyframes dizzyEye{0%,100%{transform:translate(26px, 0)}12.5%{transform:translate(18px, 18px)}25%{transform:translate(0, 26px)}37.5%{transform:translate(-18px, 18px)}50%{transform:translate(-26px, 0)}62.5%{transform:translate(-18px, -18px)}75%{transform:translate(0, -26px)}87.5%{transform:translate(18px, -18px)}}@keyframes dizzyMouth{0%,100%{transform:rotate(-7deg) scale(1, 1)}50%{transform:rotate(7deg) scale(1.12, 1)}}@keyframes orbit{0%,100%{transform:translate(270px, 0)}12.5%{transform:translate(191px, 34px)}25%{transform:translate(0, 48px)}37.5%{transform:translate(-191px, 34px)}50%{transform:translate(-270px, 0)}62.5%{transform:translate(-191px, -34px)}75%{transform:translate(0, -48px)}87.5%{transform:translate(191px, -34px)}}]]></style><ellipse class="b-shadow" cx="553" cy="1112" rx="330" ry="34"/><g class="b-rig"><path class="b-body" d="M555 28 C800 28 1045 300 1045 620 C1045 880 850 1075 555 1075 C260 1075 62 880 62 620 C62 300 310 28 555 28 Z" fill="url(#g)"/><g class="b-face"><g class="b-eyes"><ellipse class="b-eye b-eye-l" cx="362" cy="520" rx="60" ry="101"/><ellipse class="b-eye b-eye-r" cx="755" cy="520" rx="60" ry="101"/></g><path class="b-m b-m-smile" d="M448 690 Q560 752 672 690"/><ellipse class="b-m b-m-open" cx="558" cy="712" rx="46" ry="60"/><path class="b-m b-m-flat" d="M474 712 L646 712"/></g></g><g transform="translate(553 20)"><g class="b-star b-s1"><path transform="scale(1.7)" d="M0 -34 L8 -11 L33 -10 L13 5 L20 30 L0 16 L-20 30 L-13 5 L-33 -10 L-8 -11 Z"/></g><g class="b-star b-s2"><path transform="scale(1.7)" d="M0 -34 L8 -11 L33 -10 L13 5 L20 30 L0 16 L-20 30 L-13 5 L-33 -10 L-8 -11 Z"/></g><g class="b-star b-s3"><path transform="scale(1.7)" d="M0 -34 L8 -11 L33 -10 L13 5 L20 30 L0 16 L-20 30 L-13 5 L-33 -10 L-8 -11 Z"/></g><g class="b-star b-s4"><path transform="scale(1.7)" d="M0 -34 L8 -11 L33 -10 L13 5 L20 30 L0 16 L-20 30 L-13 5 L-33 -10 L-8 -11 Z"/></g></g></svg>
