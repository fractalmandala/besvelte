hA 1.2s steps(1, end) infinite}.bot-avatar[data-mood=glitch] .b-ghost-b{animation:glitchB 1.2s steps(1, end) infinite}.bot-avatar[data-mood=glitch] .b-eye{animation:glitchEye 1.2s steps(1, end) infinite}.bot-avatar[data-mood=glitch] .b-m-smile{animation:glitchSmile 1.2s steps(1, end) infinite}@keyframes glitchBot{0%,14%,33%,55%,80%,100%{transform:translate(0, 0) skewX(0deg) scale(1, 1)}10%{transform:translate(18px, 0) skewX(-9deg) scale(1.03, 0.97)}30%{transform:translate(-22px, 4px) skewX(7deg) scale(0.98, 1.02)}52%{transform:translate(10px, -6px) skewX(-5deg) scale(1.05, 0.96)}74%{transform:translate(-30px, 0) skewX(12deg) scale(1, 1)}}@keyframes glitchA{0%,14%,33%,55%,80%,100%{opacity:0;transform:translate(0, 0)}10%{opacity:.85;transform:translate(-34px, 4px)}30%{opacity:.85;transform:translate(30px, -6px)}52%{opacity:.85;transform:translate(-24px, 10px)}74%{opacity:.85;transform:translate(44px, 0)}}@keyframes glitchB{0%,14%,33%,55%,80%,100%{opacity:0;transform:translate(0, 0)}10%{opacity:.85;transform:translate(34px, -4px)}30%{opacity:.85;transform:translate(-30px, 6px)}52%{opacity:.85;transform:translate(24px, -10px)}74%{opacity:.85;transform:translate(-44px, 0)}}@keyframes glitchEye{0%,33%,80%,100%{transform:scale(1, 1)}30%{transform:scale(1.9, 0.18)}74%{transform:scale(0.5, 1.4)}}@keyframes glitchSmile{0%,55%,100%{opacity:1}52%{opacity:0}}]]></style><ellipse class="b-shadow" cx="553" cy="1112" rx="330" ry="34"/><g class="b-rig"><path class="b-ghost b-ghost-a" d="M555 28 C800 28 1045 300 1045 620 C1045 880 850 1075 555 1075 C260 1075 62 880 62 620 C62 300 310 28 555 28 Z"/><path class="b-ghost b-ghost-b" d="M555 28 C800 28 1045 300 1045 620 C1045 880 850 1075 555 1075 C260 1075 62 880 62 620 C62 300 310 28 555 28 Z"/><path class="b-body" d="M555 28 C800 28 1045 300 1045 620 C1045 880 850 1075 555 1075 C260 1075 62 880 62 620 C62 300 310 28 555 28 Z" fill="url(#g)"/><g class="b-face"><g class="b-eyes"><ellipse class="b-eye b-eye-l" cx="362" cy="520" rx="60" ry=