<svg xmlns="http://www.w3.org/2000/svg" class="bot-avatar" data-mood="jack" viewBox="-200 -150 1500 1500" width="480" height="480" role="img" aria-label="Jack-in-the-box loop"><defs><radialGradient id="g" cx="0.45" cy="0.14" r="1"><stop offset="0" stop-color="#52cd63"/><stop offset="0.5" stop-color="#2eae43"/><stop offset="1" stop-color="#12862a"/></radialGradient></defs><style><![CDATA[.bot-avatar{--bot-ink: #06110a;--bot-shadow: #1b3a23;--bot-muted: #526457;--bot-accent: #1c8f37}.b-body{stroke:rgba(4,44,16,.55);stroke-width:3}.b-ghost{opacity:0}.b-ghost-a{fill:#19f0ff}.b-ghost-b{fill:#ff2fa8}.b-rage{fill:#e8362f;opacity:0}.b-eye{fill:var(--bot-ink);transform-box:fill-box;transform-origin:center}.b-heart{fill:#ff3d6e;opacity:0;transform-box:fill-box;transform-origin:center}.b-hf{fill:#ff5c86;opacity:0;transform-box:fill-box;transform-origin:center}.b-tongue{fill:#ff7096;stroke:var(--bot-ink);stroke-width:10;stroke-linejoin:round;opacity:0;transform-box:fill-box;transform-origin:50% 0}.b-m{transform-box:fill-box;transform-origin:center}.b-m-smile,.b-m-flat{fill:none;stroke:var(--bot-ink);stroke-width:38;stroke-linecap:round}.b-m-open{fill:var(--bot-ink)}.b-m-open,.b-m-flat{opacity:0}.b-rig,.b-ghost,.b-rage{transform-box:fill-box;transform-origin:50% 100%}.b-ghost{transform-origin:center}.b-shadow{fill:var(--bot-shadow);opacity:.14;transform-box:fill-box;transform-origin:center}.b-star{fill:#ffd23f;stroke:#c98f00;stroke-width:4;stroke-linejoin:round;opacity:0}.b-puff{fill:var(--bot-muted);opacity:0;transform-box:fill-box;transform-origin:center}.b-drop{fill:#7fd3ff;opacity:0;transform-box:fill-box;transform-origin:center}.b-achoo{fill:var(--bot-accent);font-family:system-ui,sans-serif;font-weight:700;opacity:0;transform-box:fill-box;transform-origin:center}@media(prefers-reduced-motion: reduce){.bot-avatar *{animation:none !important}}.bot-avatar[data-mood=jack] .b-rig{animation:jackBot 1.6s ease-in-out infinite}.bot-avatar[data-mood=jack] .b-eye{animation:jackEye 1.6s ease-in-out infinite}.bot-avatar[data-mood=jack] .b-m-smile{animation:jackSmile 1.6s ease-in-out infinite}.bot-avatar[data-mood=jack] .b-m-open{animation:jackOpen 1.6s ease-in-out infinite}.bot-avatar[data-mood=jack] .b-shadow{animation:jackShadow 1.6s ease-in-out infinite}@keyframes jackBot{0%,14%{transform:translateY(1360px) scale(1, 1)}26%{transform:translateY(-110px) scale(0.88, 1.3)}34%{transform:translateY(24px) scale(1.12, 0.86)}42%{transform:translateY(-34px) scale(0.96, 1.08)}50%{transform:translateY(0) scale(1.04, 0.97)}56%,76%{transform:translateY(0) scale(1, 1)}86%{transform:translateY(36px) scale(1.08, 0.9)}96%,100%{transform:translateY(1360px) scale(1, 1)}}@keyframes jackEye{0%,20%{transform:scale(1, 1)}28%{transform:scale(1.3, 1.35)}50%,100%{transform:scale(1, 1)}}@keyframes jackSmile{0%,20%{opacity:1}24%,50%{opacity:0}54%,100%{opacity:1}}@keyframes jackOpen{0%,20%{opacity:0;transform:scale(0.4)}26%{opacity:1;transform:scale(1.2)}40%,50%{opacity:1;transform:scale(1)}54%,100%{opacity:0;transform:scale(0.4)}}@keyframes jackShadow{0%,18%,92%,100%{opacity:0}40%,80%{opacity:.14}}]]></style><ellipse class="b-shadow" cx="553" cy="1112" rx="330" ry="34"/><g class="b-rig"><path class="b-body" d="M555 28 C800 28 1045 300 1045 620 C1045 880 850 1075 555 1075 C260 1075 62 880 62 620 C62 300 310 28 555 28 Z" fill="url(#g)"/><g class="b-face"><g class="b-eyes"><ellipse class="b-eye b-eye-l" cx="362" cy="520" rx="60" ry="101"/><ellipse class="b-eye b-eye-r" cx="755" cy="520" rx="60" ry="101"/></g><path class="b-m b-m-smile" d="M448 690 Q560 752 672 690"/><ellipse class="b-m b-m-open" cx="558" cy="712" rx="46" ry="60"/><path class="b-m b-m-flat" d="M474 712 L646 712"/></g></g></svg>
