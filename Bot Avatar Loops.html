<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bot Avatar Loops</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a calm grid of square stages, one loop per tile, caption underneath with loop length in mono. */
:root {
  --bg: #f0f4ef;
  --surface: #e1eadf;
  --fg: #13221a;
  --muted: #526457;
  --line: #cad6c7;
  --accent: #1c8f37;
  --shadow: #1b3a23;
  --ink: #06110a;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1511;
    --surface: #17211b;
    --fg: #e5eee7;
    --muted: #92a597;
    --line: #26342b;
    --accent: #4fcb63;
    --shadow: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1511;
  --surface: #17211b;
  --fg: #e5eee7;
  --muted: #92a597;
  --line: #26342b;
  --accent: #4fcb63;
  --shadow: #000000;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--display);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 40px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; margin-bottom: 28px; }
header > div { min-width: 0; flex: 1 1 360px; }
h1 { font-size: clamp(28px, 5vw, 42px); line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 52ch; }

.toggle {
  font: 500 13px var(--mono);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 9px 18px;
  cursor: pointer;
}
.toggle:hover { border-color: var(--accent); color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 20px; }
.tile { min-width: 0; }
.stage-btn {
  display: block; width: 100%; padding: 0; border: 0; cursor: pointer;
  background: var(--surface); border-radius: 18px; overflow: hidden;
}
.stage { display: block; width: 100%; height: auto; }
.cap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 10px; }
.cap h2 { font-size: 17px; font-weight: 600; margin: 0; }
.cap span { font: 400 12px var(--mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.desc { margin: 2px 0 0; font-size: 14px; color: var(--muted); max-width: 34ch; }

/* ---- bot art ---- */
.body { fill: url(#bodyGrad); stroke: rgba(4, 44, 16, 0.55); stroke-width: 3; }
.eye { fill: var(--ink); transform-box: fill-box; transform-origin: center; }
.m { transform-box: fill-box; transform-origin: center; }
.m-smile, .m-flat { fill: none; stroke: var(--ink); stroke-width: 38; stroke-linecap: round; }
.m-open { fill: var(--ink); }
.m-open, .m-flat { opacity: 0; }
.bot { transform-box: fill-box; transform-origin: 50% 100%; }
.shadow { fill: var(--shadow); opacity: 0.14; transform-box: fill-box; transform-origin: center; }
.z, .dot { opacity: 0; transform-box: fill-box; transform-origin: center; }
.z { fill: var(--muted); font-family: var(--display); font-weight: 700; }
.dot { fill: var(--muted); }

/* ---- 1 peek in ---- */
.anim.k-peek .shadow { opacity: 0; }
.anim.k-peek .bot { animation: peekBot 2s ease-in-out infinite; }
.anim.k-peek .face { animation: peekFace 2s ease-in-out infinite; }
@keyframes peekBot {
  0% { transform: translateY(1360px); } 16% { transform: translateY(700px); } 34% { transform: translateY(700px); }
  50% { transform: translateY(540px); } 70% { transform: translateY(540px); } 86% { transform: translateY(1360px); } 100% { transform: translateY(1360px); }
}
@keyframes peekFace {
  0%, 18% { transform: translate(0, 0); } 22% { transform: translate(-34px, 0); } 28% { transform: translate(34px, 0); } 33% { transform: translate(0, 0); }
  54% { transform: translate(0, 0); } 58% { transform: translate(22px, 0); } 64% { transform: translate(-22px, 0); } 69%, 100% { transform: translate(0, 0); }
}

/* ---- 2 bob ---- */
.anim.k-bob .bot { animation: bobBot 1.6s ease-in-out infinite; }
.anim.k-bob .face { animation: bobFace 1.6s ease-in-out -0.12s infinite; }
.anim.k-bob .shadow { animation: bobShadow 1.6s ease-in-out infinite; }
@keyframes bobBot { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-34px) scale(1.012, 0.994); } }
@keyframes bobFace { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -9px); } }
@keyframes bobShadow { 0%, 100% { transform: scale(1); opacity: 0.14; } 50% { transform: scale(0.86); opacity: 0.08; } }

/* ---- 3 eyes widen ---- */
.anim.k-surprise .bot { animation: surpBot 2s ease-in-out infinite; }
.anim.k-surprise .face { animation: surpFace 2s ease-in-out infinite; }
.anim.k-surprise .eye { animation: surpEye 2s ease-in-out infinite; }
.anim.k-surprise .m-smile { animation: surpSmile 2s ease-in-out infinite; }
.anim.k-surprise .m-open { animation: surpOpen 2s ease-in-out infinite; }
@keyframes surpBot {
  0% { transform: translateY(0) scale(1, 1); } 9% { transform: translateY(-30px) scale(0.99, 1.03); } 20% { transform: translateY(0) scale(1.03, 0.97); }
  28%, 100% { transform: translateY(0) scale(1, 1); }
}
@keyframes surpFace { 0%, 100% { transform: translate(0, 0); } 9% { transform: translate(0, -16px); } 20%, 74% { transform: translate(0, -6px); } 86% { transform: translate(0, 0); } }
@keyframes surpEye { 0% { transform: scale(1, 1); } 9% { transform: scale(1.3, 1.38); } 20%, 74% { transform: scale(1.2, 1.26); } 88%, 100% { transform: scale(1, 1); } }
@keyframes surpSmile { 0%, 8% { opacity: 1; } 11%, 74% { opacity: 0; } 78%, 100% { opacity: 1; } }
@keyframes surpOpen { 0%, 8% { opacity: 0; transform: scale(0.4); } 11% { opacity: 1; transform: scale(1.12); } 20%, 74% { opacity: 1; transform: scale(1); } 78%, 100% { opacity: 0; transform: scale(0.4); } }

/* ---- 4 blink ---- */
.anim.k-blink .bot { animation: breathBot 2s ease-in-out infinite; }
.anim.k-blink .eye { animation: blinkEye 2s ease-in-out infinite; }
@keyframes breathBot { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, 1.02); } }
@keyframes blinkEye { 0%, 38% { transform: scaleY(1); } 41% { transform: scaleY(0.06); } 45%, 56% { transform: scaleY(1); } 59% { transform: scaleY(0.06); } 63%, 100% { transform: scaleY(1); } }

/* ---- 5 look around ---- */
.anim.k-look .bot { animation: lookBot 2s ease-in-out infinite; }
.anim.k-look .face { animation: lookFace 2s ease-in-out infinite; }
.anim.k-look .eyes { animation: lookEyes 2s ease-in-out infinite; }
@keyframes lookBot { 0%, 8%, 92%, 100% { transform: rotate(0deg); } 22%, 40% { transform: rotate(-2.2deg); } 56%, 76% { transform: rotate(2deg); } }
@keyframes lookFace { 0%, 8%, 92%, 100% { transform: translate(0, 0); } 22%, 40% { transform: translate(-70px, 0); } 56%, 76% { transform: translate(60px, 0); } }
@keyframes lookEyes { 0%, 8%, 92%, 100% { transform: translate(0, 0); } 22%, 40% { transform: translate(-26px, 0); } 56%, 76% { transform: translate(22px, 0); } }

/* ---- 6 happy hop ---- */
.anim.k-hop .bot { animation: hopBot 1.2s ease-in-out infinite; }
.anim.k-hop .eye { animation: hopEye 1.2s ease-in-out infinite; }
.anim.k-hop .m-smile { animation: hopMouth 1.2s ease-in-out infinite; }
.anim.k-hop .shadow { animation: hopShadow 1.2s ease-in-out infinite; }
@keyframes hopBot {
  0%, 100% { transform: translateY(0) scale(1.07, 0.9); } 12% { transform: translateY(-70px) scale(0.95, 1.07); } 45% { transform: translateY(-175px) scale(1, 1); }
  78% { transform: translateY(-30px) scale(0.97, 1.04); } 90% { transform: translateY(0) scale(1.08, 0.88); }
}
@keyframes hopEye { 0%, 100% { transform: scaleY(1); } 12%, 78% { transform: scaleY(0.35); } 92% { transform: scaleY(1); } }
@keyframes hopMouth { 0%, 100% { transform: scale(1, 1); } 12%, 78% { transform: scale(1.25, 1.3); } 92% { transform: scale(1, 1); } }
@keyframes hopShadow { 0%, 100% { transform: scale(1); opacity: 0.14; } 45% { transform: scale(0.55); opacity: 0.06; } }

/* ---- 7 sleepy ---- */
.anim.k-sleepy .bot { animation: sleepBot 2s ease-in-out infinite; }
.anim.k-sleepy .eye { animation: sleepEye 2s ease-in-out infinite; }
.anim.k-sleepy .m-smile { animation: sleepSmile 2s ease-in-out infinite; }
.anim.k-sleepy .m-flat { animation: sleepFlat 2s ease-in-out infinite; }
.anim.k-sleepy .z { animation: zFloat 2s ease-in infinite; }
.anim.k-sleepy .z2 { animation-delay: -0.25s; }
@keyframes sleepBot {
  0%, 100% { transform: translateY(0) rotate(0deg); } 40%, 58% { transform: translateY(22px) rotate(3deg); } 63% { transform: translateY(-14px) rotate(-1deg); } 75% { transform: translateY(0) rotate(0deg); }
}
@keyframes sleepEye { 0%, 100% { transform: scaleY(1); } 8% { transform: scaleY(0.85); } 40% { transform: scaleY(0.12); } 55%, 60% { transform: scaleY(0.1); } 63% { transform: scaleY(0.95); } 72% { transform: scaleY(0.9); } 85% { transform: scaleY(0.5); } }
@keyframes sleepSmile { 0%, 20%, 64%, 100% { opacity: 1; } 32%, 58% { opacity: 0; } }
@keyframes sleepFlat { 0%, 20%, 64%, 100% { opacity: 0; } 32%, 58% { opacity: 1; } }
@keyframes zFloat {
  0%, 36% { opacity: 0; transform: translate(0, 0) scale(0.6); } 50%, 62% { opacity: 1; } 70%, 100% { opacity: 0; transform: translate(60px, -120px) scale(1.1); }
}

/* ---- 8 thinking ---- */
.anim.k-think .bot { animation: thinkBot 2s ease-in-out infinite; }
.anim.k-think .face { animation: thinkFace 2s ease-in-out infinite; }
.anim.k-think .eyes { animation: thinkEyes 2s ease-in-out infinite; }
.anim.k-think .eye-l { animation: thinkEyeL 2s ease-in-out infinite; }
.anim.k-think .eye-r { animation: thinkEyeR 2s ease-in-out infinite; }
.anim.k-think .m-smile { animation: thinkSmile 2s ease-in-out infinite; }
.anim.k-think .m-flat { animation: thinkFlat 2s ease-in-out infinite; }
.anim.k-think .d1 { animation: dotA 2s ease-in-out infinite; }
.anim.k-think .d2 { animation: dotB 2s ease-in-out infinite; }
.anim.k-think .d3 { animation: dotC 2s ease-in-out infinite; }
@keyframes thinkBot { 0%, 8%, 90%, 100% { transform: rotate(0deg); } 25%, 70% { transform: rotate(3deg); } }
@keyframes thinkFace { 0%, 8%, 90%, 100% { transform: translate(0, 0); } 25%, 70% { transform: translate(46px, -58px); } }
@keyframes thinkEyes { 0%, 8%, 90%, 100% { transform: translate(0, 0); } 25%, 70% { transform: translate(14px, -14px); } }
@keyframes thinkEyeL { 0%, 8%, 90%, 100% { transform: scale(1, 1); } 25%, 70% { transform: scale(1, 0.82); } }
@keyframes thinkEyeR { 0%, 8%, 90%, 100% { transform: scale(1, 1); } 25%, 70% { transform: scale(1.08, 1.12); } }
@keyframes thinkSmile { 0%, 14%, 84%, 100% { opacity: 1; } 22%, 72% { opacity: 0; } }
@keyframes thinkFlat { 0%, 14%, 84%, 100% { opacity: 0; transform: translate(0, 0) rotate(0deg); } 26%, 70% { opacity: 1; transform: translate(36px, -10px) rotate(-7deg); } }
@keyframes dotA { 0%, 26%, 80%, 100% { opacity: 0; } 32%, 72% { opacity: 1; } }
@keyframes dotB { 0%, 36%, 80%, 100% { opacity: 0; } 42%, 72% { opacity: 1; } }
@keyframes dotC { 0%, 46%, 80%, 100% { opacity: 0; } 52%, 72% { opacity: 1; } }

/* ---- 9 talking ---- */
.anim.k-talk .m-smile { opacity: 0; }
.anim.k-talk .m-open { opacity: 1; animation: talkMouth 1.4s ease-in-out infinite; }
.anim.k-talk .face { animation: talkFace 1.4s ease-in-out infinite; }
.anim.k-talk .eye { animation: talkEye 1.4s ease-in-out infinite; }
@keyframes talkMouth {
  0%, 100% { transform: scale(1.2, 0.12); } 10% { transform: scale(0.9, 1); } 20% { transform: scale(1.1, 0.3); } 30% { transform: scale(0.95, 0.85); } 42% { transform: scale(1.2, 0.12); }
  52% { transform: scale(1, 0.7); } 62% { transform: scale(0.85, 1); } 72% { transform: scale(1.15, 0.2); } 82% { transform: scale(1, 0.55); }
}
@keyframes talkFace { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(0, 5px); } 30% { transform: translate(0, -3px); } 52% { transform: translate(0, 5px); } 62% { transform: translate(0, -4px); } 82% { transform: translate(0, 3px); } }
@keyframes talkEye { 0%, 70%, 78%, 100% { transform: scaleY(1); } 74% { transform: scaleY(0.08); } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="bodyGrad" cx="0.45" cy="0.14" r="1">
      <stop offset="0" stop-color="#52cd63"/>
      <stop offset="0.5" stop-color="#2eae43"/>
      <stop offset="1" stop-color="#12862a"/>
    </radialGradient>
  </defs>
</svg>

<div class="wrap">
  <header>
    <div>
      <h1>Bot avatar loops</h1>
      <p>Nine short loops of the green bot, each repeating every 1.2 to 2 seconds. Click a loop to stop or restart it.</p>
    </div>
    <button class="toggle" id="toggleAll" type="button">Stop all</button>
  </header>
  <main class="grid" id="grid"></main>
</div>

<script>
(function () {
  var BODY = "M555 28 C800 28 1045 300 1045 620 C1045 880 850 1075 555 1075 C260 1075 62 880 62 620 C62 300 310 28 555 28 Z";

  function bot(label, extra) {
    return '<svg class="stage" viewBox="-200 -150 1500 1500" role="img" aria-label="' + label + '">' +
      '<ellipse class="shadow" cx="553" cy="1112" rx="330" ry="34"/>' +
      '<g class="bot"><path class="body" d="' + BODY + '"/>' +
      '<g class="face"><g class="eyes">' +
      '<ellipse class="eye eye-l" cx="362" cy="520" rx="60" ry="101"/>' +
      '<ellipse class="eye eye-r" cx="755" cy="520" rx="60" ry="101"/></g>' +
      '<path class="m m-smile" d="M448 690 Q560 752 672 690"/>' +
      '<ellipse class="m m-open" cx="558" cy="712" rx="46" ry="60"/>' +
      '<path class="m m-flat" d="M474 712 L646 712"/></g></g>' + (extra || '') + '</svg>';
  }

  var zs = '<text class="z z1" x="900" y="250" font-size="120">z</text><text class="z z2" x="1010" y="130" font-size="150">z</text>';
  var dots = '<circle class="dot d1" cx="930" cy="200" r="16"/><circle class="dot d2" cx="1000" cy="130" r="22"/><circle class="dot d3" cx="1090" cy="50" r="30"/>';

  var tiles = [
    { k: 'peek', name: 'Peek in', dur: '2.0', desc: 'Rises from the bottom edge, glances both ways, shows a smile, ducks out.' },
    { k: 'bob', name: 'Bob', dur: '1.6', desc: 'A slow float with the face drifting a beat behind the body.' },
    { k: 'surprise', name: 'Eyes widen', dur: '2.0', desc: 'A small jump, big eyes, and a round mouth.' },
    { k: 'blink', name: 'Blink', dur: '2.0', desc: 'Idle breathing with a double blink.' },
    { k: 'look', name: 'Look around', dur: '2.0', desc: 'Face slides left, then right, with the body leaning after it.' },
    { k: 'hop', name: 'Happy hop', dur: '1.2', desc: 'Squash, launch, squinting eyes, wider smile, landing.', },
    { k: 'sleepy', name: 'Sleepy', dur: '2.0', desc: 'Eyes sink shut, head nods, then a jolt awake.', extra: zs },
    { k: 'think', name: 'Thinking', dur: '2.0', desc: 'Glances up and right, mismatched eyes, a flat mouth, three dots.', extra: dots },
    { k: 'talk', name: 'Talking', dur: '1.4', desc: 'Mouth opens and closes in an uneven rhythm with a small nod.' }
  ];

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var grid = document.getElementById('grid');
  var btnAll = document.getElementById('toggleAll');

  tiles.forEach(function (t) {
    var el = document.createElement('article');
    el.className = 'tile k-' + t.k + (reduce ? '' : ' anim');
    el.innerHTML =
      '<button class="stage-btn" type="button" aria-pressed="' + (reduce ? 'false' : 'true') + '" aria-label="' + t.name + ' loop, click to stop or restart">' +
      bot(t.name + ' loop', t.extra) + '</button>' +
      '<div class="cap"><h2>' + t.name + '</h2><span>' + t.dur + ' s loop</span></div>' +
      '<p class="desc">' + t.desc + '</p>';
    grid.appendChild(el);
  });

  function syncAll() {
    var tilesEl = grid.querySelectorAll('.tile');
    var anyOn = false;
    tilesEl.forEach(function (el) { if (el.classList.contains('anim')) anyOn = true; });
    btnAll.textContent = anyOn ? 'Stop all' : 'Play all';
  }

  grid.addEventListener('click', function (e) {
    var b = e.target.closest('.stage-btn');
    if (!b) return;
    var tile = b.closest('.tile');
    var on = tile.classList.toggle('anim');
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    syncAll();
  });

  btnAll.addEventListener('click', function () {
    var turnOn = btnAll.textContent === 'Play all';
    grid.querySelectorAll('.tile').forEach(function (el) {
      el.classList.toggle('anim', turnOn);
      el.querySelector('.stage-btn').setAttribute('aria-pressed', turnOn ? 'true' : 'false');
    });
    syncAll();
  });

  syncAll();
})();
</script>

</body></html>
